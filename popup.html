<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAPI Cookie Updater</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            color: #333;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #4285f4;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #555;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #4285f4;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #4285f4;
            color: white;
        }

        .btn-primary:hover {
            background-color: #3367d6;
        }

        .btn-secondary {
            background-color: #f1f3f4;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #e8eaed;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
        }

        .status.success {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #c6e1c6;
        }

        .status.error {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #f5c2c1;
        }

        .status.info {
            background-color: #e8f0fe;
            color: #1967d2;
            border: 1px solid #d2e3fc;
        }

        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 20px 0;
        }

        .info-section {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
        }

        .info-section strong {
            color: #333;
        }
    </style>
</head>

<body>
    <h1>🍪 WebAPI Cookie Updater</h1>

    <div class="form-group">
        <label for="apiUrl">服务器地址</label>
        <input type="text" id="apiUrl" placeholder="http://localhost:8001/api/plugin/update-cookie">
        <div class="hint">WebAPI 服务的 Cookie 更新接口地址</div>
    </div>

    <div class="form-group">
        <label for="connectionToken">连接Token</label>
        <input type="text" id="connectionToken" placeholder="输入管理员Token">
        <div class="hint">从 WebAPI 管理后台登录获取的 Token</div>
    </div>

    <div class="form-group">
        <label for="refreshInterval">刷新间隔（分钟）</label>
        <input type="number" id="refreshInterval" value="60" min="1" max="1440">
        <div class="hint">建议设置为 60 分钟（Cookie 约 2 小时过期）</div>
    </div>

    <div class="button-group">
        <button class="btn-primary" id="saveBtn">保存配置</button>
        <button class="btn-secondary" id="testBtn">立即同步</button>
    </div>

    <div class="button-group">
        <button class="btn-secondary" id="logsBtn" style="width: 100%;">📋 查看日志</button>
    </div>

    <div class="status" id="status"></div>

    <div class="divider"></div>

    <div class="info-section">
        <strong>📌 使用说明：</strong><br>
        1. 确保已登录 gemini.google.com<br>
        2. 填写 WebAPI 服务器地址和管理员 Token<br>
        3. 点击"立即同步"测试连接<br>
        4. 保存配置后，插件将自动定时同步 Cookie
    </div>

    <script src="popup.js"></script>
</body>

</html>
