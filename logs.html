<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>日志 - WebAPI Cookie Updater</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            font-size: 13px;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
        }

        h1 {
            color: #4fc3f7;
            margin-bottom: 16px;
            font-size: 18px;
        }

        .toolbar {
            margin-bottom: 16px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 8px;
        }

        .btn-clear {
            background: #f44336;
            color: white;
        }

        .btn-refresh {
            background: #4caf50;
            color: white;
        }

        .log-entry {
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 4px;
            background: #2d2d2d;
            border-left: 3px solid #666;
        }

        .log-entry.INFO {
            border-left-color: #2196f3;
        }

        .log-entry.SUCCESS {
            border-left-color: #4caf50;
        }

        .log-entry.ERROR {
            border-left-color: #f44336;
        }

        .log-time {
            color: #888;
            margin-right: 8px;
        }

        .log-level {
            font-weight: bold;
            margin-right: 8px;
        }

        .log-level.INFO {
            color: #2196f3;
        }

        .log-level.SUCCESS {
            color: #4caf50;
        }

        .log-level.ERROR {
            color: #f44336;
        }

        .log-details {
            color: #888;
            font-size: 11px;
            margin-top: 4px;
        }

        .empty {
            color: #666;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>
    <h1>📋 运行日志</h1>
    <div class="toolbar">
        <button class="btn-refresh" id="refreshBtn">🔄 刷新</button>
        <button class="btn-clear" id="clearBtn">🗑️ 清除日志</button>
    </div>
    <div id="logs"></div>

    <script>
        async function loadLogs() {
            const result = await chrome.runtime.sendMessage({ action: 'getLogs' });
            const container = document.getElementById('logs');

            if (!result.logs || result.logs.length === 0) {
                container.innerHTML = '<div class="empty">暂无日志</div>';
                return;
            }

            container.innerHTML = result.logs.map(log => `
                <div class="log-entry ${log.level}">
                    <span class="log-time">${new Date(log.timestamp).toLocaleString()}</span>
                    <span class="log-level ${log.level}">[${log.level}]</span>
                    <span class="log-message">${log.message}</span>
                    ${log.details ? `<div class="log-details">${JSON.stringify(log.details)}</div>` : ''}
                </div>
            `).join('');
        }

        document.getElementById('refreshBtn').addEventListener('click', loadLogs);
        document.getElementById('clearBtn').addEventListener('click', async () => {
            await chrome.runtime.sendMessage({ action: 'clearLogs' });
            loadLogs();
        });

        loadLogs();
    </script>
</body>

</html>
